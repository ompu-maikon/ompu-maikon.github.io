---
layout: default
---
<section class="page-hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="wrap">
    <p class="crumb"><a href="{{ '/' | relative_url }}">~</a>{{ page.url }}</p>
    <p class="eyebrow">{{ page.label }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<div class="wrap prose">
  {{ content }}
</div>
