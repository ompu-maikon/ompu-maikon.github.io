<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.layout != 'home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.lead %}{{ page.lead }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body{% if page.hero_image %} class="has-hero-photo"{% endif %}>
  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="logo" href="{{ '/' | relative_url }}"><svg class="logo-svg" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 2v4M16 2v4M21 2v4M11 26v4M16 26v4M21 26v4M2 11h4M2 16h4M2 21h4M26 11h4M26 16h4M26 21h4"/></g><rect x="6" y="6" width="20" height="20" rx="4.5" fill="currentColor"/><path d="M11.5 20.5v-9l4.5 5 4.5-5v9" fill="none" stroke="var(--term)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>{{ site.title }}</span></a>
      <button class="menu-btn" id="menu-btn" aria-label="メニュー" aria-expanded="false"><span></span><span></span></button>
      <nav class="global-nav" id="global-nav" aria-label="メインメニュー">
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.nav == item.id %} class="is-active"{% endif %}>
          <span class="gn-label">{{ item.label }}</span><span class="gn-title">{{ item.title }}</span>
        </a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <a class="logo" href="{{ '/' | relative_url }}"><svg class="logo-svg" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 2v4M16 2v4M21 2v4M11 26v4M16 26v4M21 26v4M2 11h4M2 16h4M2 21h4M26 11h4M26 16h4M26 21h4"/></g><rect x="6" y="6" width="20" height="20" rx="4.5" fill="currentColor"/><path d="M11.5 20.5v-9l4.5 5 4.5-5v9" fill="none" stroke="var(--term)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>{{ site.title }}</span></a>
        <p class="footer-desc">{{ site.description }}</p>
      </div>
      <nav class="footer-nav" aria-label="フッターメニュー">
        {% for item in site.nav %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
      </nav>
    </div>
    <div class="wrap footer-bottom"><span>&copy; {{ site.title }}</span><a href="#top">Page top ↑</a></div>
  </footer>

  {% if page.nav != 'join' %}
  <a class="sticky-cta" id="sticky-cta" href="{{ '/join/' | relative_url }}"><span>入部案内を見る</span><span class="arrow">→</span></a>
  {% endif %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
